# M0 uses one fixed public checkpoint. Seeds do not represent independent pretraining.
seeds: [0, 1, 2]
runtime:
  device: cpu
  threads: 4  # Bound local CPU use; feature extraction needs no training GPU.
data:
  root: data  # Paths are relative to this config file, not the working directory.
  download: true
  batch_size: 256
  workers: 0  # Portable Windows and Colab default.
  # Explicit preprocessing assumption; no random augmentation for reusable caches.
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
model:
  repository: chenyaofo/pytorch-cifar-models
  revision: 786c16252c0fc58ee9adac063f8337cc4a7a497a
  entrypoint: cifar100_resnet20
  feature_dim: 64
  classes: 100
cache:
  root: outputs/m0
  parity_atol: 0.00001
  parity_rtol: 0.00001
projection:
  rank: 4
  rank_atol: 0.000000000001
  rank_rtol: 0.00000001
  feasibility_atol: 0.00000001
  feasibility_rtol: 0.000001
  dtype: float64  # Resolve rank and projector drift in double precision.
lora:
  init_std: 0.01  # Explicit assumption: Gaussian A, zero B.

# M2: MNIST. Every value here is an explicit choice; see ASSUMPTIONS.md "M2".
mnist:
  hidden: 128          # Paper says "2-layer MLP" and nothing more.
  classes: 10
  mean: [0.1307]       # Standard MNIST channel statistics.
  std: [0.3081]
  epochs: 3            # Base MLP training; enough for a stable ~97% baseline.
  lr: 0.001
  batch_size: 256
unlearn:
  forget_classes: [9, 5, 3]   # The order the paper states for MNIST.
  epochs: 20           # Per unlearning task, on that class's training images.
  lr: 0.01
  batch_size: 128
  lambdas: [0.0, 0.25, 0.5, 1.0, 1.5, 2.0]
  router_epochs: 10
  router_lr: 0.01
  router_retain_per_task: 1000  # Retain examples labelled "no adapter" for the gate.
