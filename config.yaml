# M0 uses one fixed public checkpoint. Seeds do not represent independent pretraining.
seeds: [0, 1, 2]
runtime:
  device: cpu
  threads: 4  # Bound local CPU use; feature extraction needs no training GPU.
data:
  root: data  # Paths are relative to this config file, not the working directory.
  download: true
  batch_size: 256
  workers: 0  # Portable Windows and Colab default.
  # Explicit preprocessing assumption; no random augmentation for reusable caches.
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
model:
  repository: chenyaofo/pytorch-cifar-models
  revision: 786c16252c0fc58ee9adac063f8337cc4a7a497a
  entrypoint: cifar100_resnet20
  feature_dim: 64
  classes: 100
cache:
  root: outputs/m0
  parity_atol: 0.00001
  parity_rtol: 0.00001
projection:
  rank: 4
  rank_atol: 0.000000000001
  rank_rtol: 0.00000001
  feasibility_atol: 0.00000001
  feasibility_rtol: 0.000001
  dtype: float64  # Resolve rank and projector drift in double precision.
lora:
  init_std: 0.01  # Explicit assumption: Gaussian A, zero B.

# M2: MNIST. Every value here is an explicit choice; see ASSUMPTIONS.md "M2".
mnist:
  hidden: 128          # Paper says "2-layer MLP" and nothing more.
  classes: 10
  mean: [0.1307]       # Standard MNIST channel statistics.
  std: [0.3081]
  epochs: 3            # Base MLP training; enough for a stable ~97% baseline.
  lr: 0.001
  batch_size: 256
# M3: CIFAR-100. Every value here is an explicit choice; see ASSUMPTIONS.md "M3".
cifar100:
  # The paper never names the CIFAR-100 classes it deletes, or their order. The
  # first five by index is the one choice that cannot be accused of selection.
  forget_classes: [0, 1, 2, 3, 4]

# M4: the full sweep. One 30-task sequence per method and seed, read at four points,
# because the first k deletions of a 30-task run are identical to a k-task run.
m4:
  tasks: 30                       # Classes 0 to 29, same order rule as M3.
  checkpoints: [5, 10, 20, 30]    # The N values the paper's Table I reports.
  rank_sweep: [2, 4, 8]           # Test T2: budgets 32, 16, 8.
  rank_sweep_margin: 2            # Tasks to run past each predicted budget.

# M5 isolates Fig. 3: the in-training method at every deletion, including task zero.
m5:
  run_label: nb05-cifar100-saturation-v1
  tasks: 30
  lambda: 2.0
  update_zero_atol: 0.0000000001  # Same numerical-zero criterion as diagnostic T4.
  weight_drift_atol: 0.0000000001
  paper_retain_reference: 58.5   # Sec. IV-D, a reference, not our matched baseline.
  paper_free_rank_reference: 23
  paper_transition_task: 16
  paper_tolerance_pp: 5.0       # AGENTS.md soft replication tolerance, not uncertainty.

stage_b_start:
  run_label: nb07-cifar100-request16-dev-v1
  tasks: 16                 # Train on class IDs 0..15. ID 16 is the next target.
  fixed_retain_start: 30    # Classes 30..99 survive the planned 30-request sequence.
  lambdas: [0.5, 1.0]       # Evaluate both on each seed's exact same adapter updates.
  dev_per_class: 100        # One percentage point per image. Remaining 400 can train adapters.
  split_seed: 1701          # One stratified split shared by every adapter seed and strength.
  # Proposed development criteria, chosen before this run. Apply to every seed.
  max_retain_loss_pp: 5.0   # Allow at most five fewer correct predictions per hundred.
  max_old_accuracy_pct: 20.0  # Each target at its own deletion AND at request 16.
  max_reversal_pp: 10.0     # Largest allowed rebound from own deletion to request 16.
  min_next_accuracy_pct: 20.0  # Leave at least 20 points of headroom for request 17.

stage_b_order:
  run_label: nb08-cifar100-paired-order-v1
  lambda: 0.5                # Passed the retained accuracy limit in all three notebook 07 seeds.
  swap_count: 2              # Exchange the first and last two requests, keeping within-pair order.
  min_position_gap_pp: 10.0  # Pilot minimum: ten more correct images out of 100 when requested late.

unlearn:
  # MNIST only. CIFAR-100 reads cifar100.forget_classes; the rest of this block
  # is shared by both datasets.
  forget_classes: [9, 5, 3]   # The order the paper states for MNIST.
  epochs: 20           # Per unlearning task, on that class's training images.
  lr: 0.01
  batch_size: 128
  lambdas: [0.0, 0.25, 0.5, 1.0, 1.5, 2.0]
  router_epochs: 10
  router_lr: 0.01
  router_retain_per_task: 1000  # Retain examples labelled "no adapter" for the gate.
